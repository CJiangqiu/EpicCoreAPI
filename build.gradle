import java.util.jar.JarFile

plugins {
    id 'maven-publish'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.mod_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

base {
    archivesName = project.archives_name
}

jarJar.enable()

// The native extension has no Minecraft references and is isolated from the standard artifact.
sourceSets {
    jvmti
    pro {
        java.srcDir 'src/pro/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

repositories {
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://cursemaven.com"; content { includeGroup "curse.maven" } }
    maven { name = "Progwml6"; url = "https://dvs1.progwml6.com/files/maven/" }
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    maven { name = "ModMaven"; url = "https://modmaven.dev" }
    maven { name = "SpongePowered"; url = "https://repo.spongepowered.org/repository/maven-public/" }
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { eca { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { eca { source sourceSets.main } }
        }
    }
}

dependencies {
    jvmtiCompileOnly 'net.java.dev.jna:jna:5.12.1'
    proImplementation files('lib/forgevm-0.7.0.jar')
    minecraft "net.minecraftforge:forge:${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.reflections:reflections:0.9.12'
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-commons:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    implementation 'org.ow2.asm:asm-analysis:9.7.1'
    implementation jarJar('io.netty:netty-codec-http:[4.1.82.Final,4.1.83.Final)') {
        transitive = false
        jarJar.pin(it, '4.1.82.Final')
    }
    minecraftLibrary('io.netty:netty-codec-http:4.1.82.Final') {
        transitive = false
    }
    implementation fg.deobf("curse.maven:geckolib-388172:7553267")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

mixin {
    add sourceSets.main, "mixins.eca.refmap.json"
    config "eca.mixins.json"
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/mods.toml') {
        expand 'mod_version': project.mod_version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    it.options.release = 17
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.jar {
    destinationDirectory = layout.buildDirectory.dir('intermediates/slim')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'eca.mixins.dev.json'
}

tasks.named('jarJar') {
    archiveFileName.set("${project.archives_name}-${project.version}_cf.jar")
    exclude 'eca.mixins.dev.json'
}

// Agent JAR
tasks.register('agentJar', Jar) {
    group = 'build'
    dependsOn tasks.named('classes')
    archiveBaseName = 'agent'
    destinationDirectory = layout.buildDirectory.dir('embedded-agent')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        include 'net/eca/agent/**'
    }

    manifest {
        attributes(
                'Agent-Class': 'net.eca.agent.EcaAgent',
                'Premain-Class': 'net.eca.agent.EcaAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.named('jarJar') {
    dependsOn tasks.named('agentJar')

    from(tasks.named('agentJar').flatMap { it.archiveFile }) {
        into 'net/eca/agent'
        rename { 'agent.jar' }
    }
}

tasks.named('jar') {
    dependsOn tasks.named('agentJar')

    from(tasks.named('agentJar').flatMap { it.archiveFile }) {
        into 'net/eca/agent'
        rename { 'agent.jar' }
    }
}

tasks.register('jvmtiBackendJar', Jar) {
    group = 'build'
    description = 'Packages the optional JVMTI backend; JNA is supplied by the game runtime.'
    dependsOn tasks.named('jvmtiClasses')
    archiveFileName.set('jvmti-backend.jar')
    destinationDirectory = layout.buildDirectory.dir('embedded-jvmti')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.jvmti.output
}

tasks.register('devJar', Jar) {
    group = 'build'
    description = 'Builds the MCreator development variant with JVMTI and development mixins.'
    dependsOn tasks.named('classes'), tasks.named('agentJar'), tasks.named('jarJar'), tasks.named('jvmtiBackendJar')
    archiveFileName.set("${project.archives_name}-${project.version}_dev.jar")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        exclude 'eca.mixins.json'
    }
    from({ zipTree(tasks.named('jarJar').get().archiveFile.get().asFile) }) {
        include 'META-INF/jarjar/**'
    }

    from(tasks.named('agentJar').flatMap { it.archiveFile }) {
        into 'net/eca/agent'
        rename { 'agent.jar' }
    }
    from(tasks.named('jvmtiBackendJar').flatMap { it.archiveFile }) {
        into 'net/eca/optional'
    }

    manifest {
        attributes([
                'MixinConfigs': 'eca.mixins.dev.json'
        ])
    }
}

tasks.register('mrJar', Jar) {
    group = 'build'
    description = 'Builds the Modrinth variant from the CurseForge variant plus JVMTI.'
    dependsOn tasks.named('reobfJarJar'), tasks.named('jvmtiBackendJar')
    archiveFileName.set("${project.archives_name}-${project.version}_mr.jar")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(tasks.named('jarJar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    // Preserve the production manifest, including Mixin configuration, after reobfuscation.
    doFirst {
        def standardJar = tasks.named('jarJar').get().archiveFile.get().asFile
        new JarFile(standardJar).withCloseable { archive ->
            archive.manifest.mainAttributes.each { key, value ->
                manifest.attributes([(key.toString()): value.toString()])
            }
        }
    }
    from(tasks.named('jvmtiBackendJar').flatMap { it.archiveFile }) {
        into 'net/eca/optional'
    }
}

tasks.register('proAgentJar', Jar) {
    group = 'build'
    description = 'Packages the Pro agent with its early interception implementation.'
    dependsOn tasks.named('classes'), tasks.named('proClasses')
    archiveFileName.set('agent.jar')
    destinationDirectory = layout.buildDirectory.dir('embedded-pro-agent')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        include 'net/eca/agent/**'
    }
    from(sourceSets.pro.output) {
        include 'net/eca/agent/**'
    }

    manifest {
        attributes(
                'Agent-Class': 'net.eca.agent.EcaAgent',
                'Premain-Class': 'net.eca.agent.EcaAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.register('proJar', Jar) {
    group = 'build'
    description = 'Builds the Pro variant from the Modrinth feature set plus Pro runtime components.'
    dependsOn tasks.named('reobfJarJar'), tasks.named('jvmtiBackendJar'), tasks.named('proClasses'),
            tasks.named('proAgentJar')
    archiveFileName.set("${project.archives_name}-${project.version}_pro.jar")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(tasks.named('jarJar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF', 'logo.png', 'net/eca/agent/agent.jar'
    }
    from sourceSets.pro.output
    from({ zipTree(file('lib/forgevm-0.7.0.jar')) }) {
        include 'forgevm/**'
    }
    from(tasks.named('jvmtiBackendJar').flatMap { it.archiveFile }) {
        into 'net/eca/optional'
    }
    from(tasks.named('proAgentJar').flatMap { it.archiveFile }) {
        into 'net/eca/agent'
        rename { 'agent.jar' }
    }
    doFirst {
        def standardJar = tasks.named('jarJar').get().archiveFile.get().asFile
        new JarFile(standardJar).withCloseable { archive ->
            archive.manifest.mainAttributes.each { key, value ->
                manifest.attributes([(key.toString()): value.toString()])
            }
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('mrJar'), tasks.named('devJar'), tasks.named('proJar')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
